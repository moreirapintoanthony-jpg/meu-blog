<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: lightblue; /* Cor de fundo do cabeçalho */
            color: darkblue; /* Cor do texto do cabeçalho */
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: white; /* Cor de fundo da área principal */
            color: black; /* Cor do texto principal */
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        article {
            display: flex;
            align-items: center; /* Centraliza verticalmente a imagem e o texto no artigo */
            margin-bottom: 20px; /* Adiciona um espaço entre artigos */
        }

        img {
            width: 80px;
            height: 80px;
            margin-right: 16px; /* Espaço entre a imagem e o texto */
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Nome do Blog</h1>
        <p>Vou compartilhar sobre…</p>
    </header>

    <main>
        <article>
